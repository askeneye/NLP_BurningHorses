[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nlp_burninghorses"
version = "0.0.1"
description = "Does order-agnostic supervision improve BERT-based NER performance?"
authors = [
  { name = "ITU" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["nlp_burninghorses"]
include = ["pyproject.toml", "nlp_burninghorses/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["nlp_burninghorses"]
force-sort-within-sections = true

