# Script-local default config for the clean reproduction pipeline.

run:
  name: "single_ensemble_to_bert"
  dataset: "conll2003"
  task: "ner"

default_profile:
  k_shot: 5
  split_seed: 242
  split_name: "k5_seed242"

paths:
  raw_data_root: "data/raw/conll2003"
  reproduction_root: "reproduction"
  data_root: "reproduction/data"
  interim_root: "reproduction/data/interim"
  models_root: "reproduction/models"
  logs_root: "reproduction/logs"
  reports_root: "reproduction/reports"
  pattern_bank_file: "scripts/assets/patterns.yaml"

teacher_ensemble:
  model_name: "facebook/bart-base"
  ensemble_size: 10
  pattern_ids:
    - "pattern_01"
    - "pattern_02"
    - "pattern_03"
    - "pattern_04"
    - "pattern_05"
    - "pattern_06"
    - "pattern_07"
    - "pattern_08"
    - "pattern_09"
    - "pattern_10"
  permutations_per_example: 24
  train:
    learning_rate: 2.0e-5
    batch_size: 8
    eval_batch_size: 32
    max_steps: 2000
    eval_steps: 100
    model_selection_strategy: "last_step"
    use_early_stopping: false

teacher_outputs:
  soft_label_variant: "hard_argmax"
  temperature: 2.0
  filter_top_k: 1000
  max_no_entity_fraction: 0.1

student:
  model_name: "google-bert/bert-base-cased"
  max_steps: 600
  train_batch_size: 16
  eval_batch_size: 16
  learning_rate: 2.0e-5
  model_selection_strategy: "last_step"
  use_early_stopping: false

runner:
  overwrite_existing: false
  dry_run: false

expected_metrics:
  single_ensemble_to_bert:
    test_span_strict_f1: 0.6232
  single_teacher_to_bert:
    test_span_strict_f1: 0.5477
